version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: campusseekers-postgres
    restart: always
    environment:
      POSTGRES_DB: campusseekers
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campusseekers"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusseekers-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=campusseekers
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - SPRING_PROFILES_ACTIVE=dev
      - JWT_SECRET=9a4f2c8d3e1b7f6a5c4d3e2b1a0f9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a21
      - JWT_EXPIRATION=86400000
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
