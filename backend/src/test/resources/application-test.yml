spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/campusseekers_test
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false

import:
  batch-size: 500
  dry-run-default: false
  max-file-size: 10485760
  paths:
    colleges: "../data/final/colleges/colleges.csv"
    branches: "../data/final/branches/branches.csv"
    college-branches: "../data/final/college_branches/college_branches.csv"
    cutoffs: "../data/final/cutoffs/cutoffs.csv"
    seat-matrix: "../data/final/seat_matrix/seat_matrix.csv"

recommendation:
  safe-threshold: 3.0
  target-threshold: 1.5
  dream-threshold: 0.0
  maximum-results: 50
  maximum-allowed-results: 100
  cache-minutes: 10
  engine-version: "1.0"
  algorithm-version: "historical-cutoff-v1"

