spring:
  profiles:
    active: dev
  application:
    name: campusseekers-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:campusseekers}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

application:
  security:
    jwt:
      # Minimum 256-bit key for HMAC-SHA256
      secret-key: ${JWT_SECRET:9a4f2c8d3e1b7f6a5c4d3e2b1a0f9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a21}
      # 1 day = 86400000 milliseconds
      expiration: ${JWT_EXPIRATION:86400000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always

import:
  batch-size: 500
  dry-run-default: false
  max-file-size: 10485760
  paths:
    colleges: "../data/final/colleges/colleges.csv"
    branches: "../data/final/branches/branches.csv"
    college-branches: "../data/final/college_branches/college_branches.csv"
    cutoffs: "../data/final/cutoffs/cutoffs.csv"
    seat-matrix: "../data/final/seat_matrix/seat_matrix.csv"

recommendation:
  safe-threshold: 3.0
  target-threshold: 1.5
  dream-threshold: 0.0
  maximum-results: 50
  maximum-allowed-results: 100
  cache-minutes: 10
  engine-version: "1.0"
  algorithm-version: "historical-cutoff-v1"
  fallback-selection-policy: "HIGHEST_PERCENTILE"

